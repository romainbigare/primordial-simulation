[package]
name = "cli"
edition.workspace = true
version.workspace = true

[[bin]]
name = "ew"
path = "src/main.rs"

[dependencies]
pcore = { path = "../core" }
worldgen = { path = "../worldgen" }
tape = { path = "../tape" }
png = "0.17"
serde_json = "1"
# The allocator of `ew` (main.rs)
mimalloc = "0.1"

[features]
# Flow, Change, the survey and the bodies on threads (the same results as without), on by default;
# `--no-default-features` runs without.
default = ["threads"]
threads = ["pcore/threads"]
