[workspace]
resolver = "2"
members = ["core", "worldgen", "tape", "cli", "wasm", "web/shade"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The page's WebAssembly (`web/package.json`, `npm run wasm`): no debug info, so the file stays small.
[profile.wasm]
inherits = "release"
debug = 0
strip = true
