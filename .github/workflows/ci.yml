name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release --workspace
      # The slow tests: long runs, the learning scene over 1,600 seeds, the speed benchmark.
      - run: cargo test --release --workspace -- --ignored
      # The threads build gives the golden runs' fingerprints too.
      - run: cargo test --release -p tape --test golden --features pcore/threads
      - run: cargo build -p pcore --target wasm32-unknown-unknown
