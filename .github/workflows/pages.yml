# The page on GitHub Pages: at each push to main, the page (web/dist/index.html), the core as WebAssembly (ew.wasm) and
# the detail's pictures beside it are built and published (web/package.json `build` and `wasm`).
name: Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits for the one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the WebAssembly target
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: TypeScript
        run: npm install -g typescript@6.0.2
      - name: The page
        working-directory: web
        run: npm run build
      - name: The core as WebAssembly
        working-directory: web
        run: npm run wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
