[package]
name = "worldgen"
edition.workspace = true
version.workspace = true

[dependencies]
pcore = { path = "../core" }
serde.workspace = true
toml = "0.8"
# The planet's table shipped with the build (`planet::table`)
bincode = "1.3"

[features]
# The shared setup of the tests (`testkit`): turned on by the dev-dependencies of the crates that test with it, and by
# the command line for `ew card` (the test card).
testkit = []
