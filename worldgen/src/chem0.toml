# 21: burning body matter, C120H196N6O106Ca + 118 O2 -> 119 CO2 + 92 H2O + 3 N2H4O3 (as 1, for the mineral, 24) + CaCO3 (as 10, lime): the
# nitrogen goes back to the ground as the mineral and the rock element as lime (it has no liquid to dissolve in here; in the ground it
# meets the liquid and the gas and becomes the salt 23 by reaction 22). Open world: first order in the matter, the oxygen to its 6th power
# (ord: the power the rate law of the 6-unit matter had, 0.21^6 = 8.6e-5; 40 meetings at once are no mass action), so for 0.2 of it a year at 290 K (rate 6.5e-9 /s,
# 18.6% lost in a year) k exp(-ea/290) = 6.5e-9 / 8.6e-5 = 7.6e-5 /s; ea 9000 K (7760 for 1: structure resists), k = 7.6e-5 x
# exp(9000/290) = 2.28e9. The litter constant of 1 (0.27 a year), a little lower for the tissue that resists. It was
# 5% a year (k 5.7e8): the figure for standing dead stems, not for the litter of plants that live a month. (A rate per mol of matter,
# so the same per kg when the unit of matter grew three times, 15 Oct 2026.)
[[r]] # 21
i = [[22,1],[2,118]]
o = [[3,119],[0,92],[24,3],[10,1]]
ord = [1,6]
k = 2.28e9
ea = 9000

# 22 and 23: the liquid's store of carbon, CaCO3 + CO2 + H2O <-> Ca(HCO3)2 both ways. Plain mass action. The way back is
# written for three of the salt (3 Ca(HCO3)2 -> 3 CaCO3 + 3 CO2 + 3 H2O) because the real way back takes one Ca2+ and two
# HCO3-, three particles whose shares in the liquid multiply: its rate per unit of the salt goes with the salt's share of
# the liquid to the power 3 - 1 = 2. So the liquid holds salt in proportion to its own amount (to the power 2/3; a dry cell
# holds none) and to the cube root of the gas over it (the real law, [Ca2+][HCO3-]^2 = K pCO2, gives the cube root too).
# - Ea: 22 is gas transfer, 1.4 times faster per 10 K -> 2,800 K. 23 is 2,800 + dH/R = 2,800 + 40.3e3/8.314 = 7,647 K, so
#   the balance moves with warmth as dH says (the liquid holds less when warm).
# - k of 22: a deep liquid takes the air's gas at the Earth's gross exchange between air and its liquid cover, 80 of 589 PgC a year
#   (Ciais et al. 2013) over the 71% of the planet that the liquid covers: 0.19 a year per unit of the gas over it at 288 K
#   (6.0e-9 /s). By mass action (Law 2) the contact of the rock, the air and the liquid is the rock, the smallest: the rate per
#   unit of the gas is k exp(-2800 / T) x (the liquid's share) x the rock / the air over the cell. The anchor's floor is the loose
#   ground of the start, 1 m of it a tenth rock by volume (2,710 mol/m2), less the 500 mol/m2 the salt took at 500 m: 2,210 mol/m2
#   under 3.59e5 mol/m2 of air (the column at 101 kPa). k = 6.0e-9 exp(2800 / 288) x 3.59e5 / 2210 = 1.62e-2 (1.0e-4 when the
#   rate went per unit of the scarce gas whatever the rock).
# - k of 23: set so the balance at 288 K, 400 ppm of the gas and a liquid 500 m deep (the depth of this map's low ground:
#   median 660 m, mean 540 m) is 1.0 mol of salt per m3 of liquid (2.0 mol/m3 of dissolved carbon, the measured amount in
#   the liquid cover of the Earth; pure calcite and gas give 0.6). The balance is S^3 = (k22 / k23) exp(4847 / T) x (the gas over the cell) x
#   (the liquid)^2, so k23 exp(-7647 / 288) = k22 exp(-2800 / 288) x 144 x (2.78e7)^2 / 500^3 = 5.36 /s, k = 1.8e12.
#   Worldgen finds the balance of each cell from these two (`pcore::change::Reactor::balance`).
[[r]] # 22
i = [[10,1],[3,1],[0,1]]
o = [[23,1]]
k = 1.62e-2
ea = 2800

[[r]] # 23
i = [[23,3]]
o = [[10,3],[3,3],[0,3]]
k = 1.8e12
ea = 7647


# 24: fixing the air's nitrogen into the mineral, paid by the fuel: N2 + H2O + CH2O + O2 -> N2H4O3 + CO. It is the reaction that takes
# energy, N2 + 2 H2O + CO2 -> N2H4O3 + CO, dH = -365 + -110.5 - (2 x -286 + -393.5) = +490 kJ per mol of 1 (real nitrogenase spends
# 16 ATP per N2, 16 x 30.5 kJ, the standard free energy of the hydrolysis of ATP = 488), together with the burning of one unit of
# the energy-rich solid that pays for it, CH2O + O2 -> CO2 + H2O, -467.5 kJ (reaction 1): the CO2 and one H2O cancel. dH = -365 +
# -110.5 - (-286 + -212) = +22.5 kJ: the fuel pays 95% of it (the sim's convention for work is the energy at face value, 100%, as
# `c_copy` and the others carry the real efficiency; a real cell makes its ATP at about 35%, which would take 3 units and make the
# reaction a burner, and the burners of a body run on demand for its upkeep, `body::pay`, and not as the catalysts of a reaction
# that takes heat do; so it stays a little endothermic, the ground paying the 22.5). In the first version of it (the +490 one,
# measured on 15 Oct 2026) the ground paid all 490 kJ as heat, the fixer paid only for the enzyme, and the fixing of 10% of the founders
# flooded the world with the mineral (170 times the soil in 60 years) and went to 80% to 100% of the plants: it was free.
# The reduced carbon gas leaves with the energy, as the hydrogen gas of the enzyme leaves with a part of what it spends.
# A high barrier: ea 6600 K (55 kJ/mol, a factor e^23 at 290 K), k 8e-8: 1e-17 /s per mol of the scarce input at 290 K, nothing in the open
# (3e-10 a year), and 1e-10 /s at 1000 K, 1e-9 at 1500 K: a burning node does not fix its air (a higher barrier with the same rate
# at 290 K would run away at 1000 K). Only a body whose genes speed it up fixes any, and it pays for the enzyme by capacity.
[[r]] # 24
i = [[1,1],[0,1],[5,1],[2,1]]
o = [[24,1],[21,1]]
k = 8e-8
ea = 6600

# 25: the mineral breaking down hot, 2 N2H4O3 -> 2 N2 + 4 H2O + O2 (the salt breaks down above 450 K, exothermic: -2 x -365 + 4 x -286
# = -414 kJ): the nitrogen of burning matter that went to the mineral (21) leaves as the gas where the heat is, to the air (real
# fires lose most of the nitrogen of what they burn). A barrier ea 20000 K (170 kJ/mol, as the salt's): 2.6e9 exp(-20000 / T) /s,
# nothing at 290 K (3e-21 /s), 1e-8 /s at 500 K, 1e-3 /s at 700 K, 5 /s at 1000 K.
[[r]] # 25
i = [[24,2]]
o = [[1,2],[0,4],[2,1]]
k = 2.6e9
ea = 20000

# Growth, which is not a reaction of the open world: what bodies make of the energy-rich solid, the nitrogen mineral and the rock salt, paid by work (Copy): [inputs], [outputs]; the first output is the matter that builds bodies.
[build]
i = [[5,118],[24,3],[23,1]]
o = [[22,1],[0,27]]

