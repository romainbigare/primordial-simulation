# dense_drop K per g/kg (how far what is dissolved lowers that; none: 0), hard/str 0..1,
# refl [[solid rgb], [liquid rgb]], ir m2/mol, sat mol/m2 (column past which the optical depth grows as the square root of
# the amount; none: always in proportion), sw m2/mol and swsat mol/m2 (the same for sunlight; none: 0),
# sol mole fraction (for a gas that cannot condense on the ground: dissolved under
# 101 kPa of it at 298 K; for a solid that melts above the ground's warmth: the mole fraction of its solution at saturation,
