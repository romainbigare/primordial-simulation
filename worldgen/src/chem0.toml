# 23: a salt that exists only dissolved in the liquid, Ca(HCO3)2 (162 g/mol; the real compound is calcium bicarbonate): it
# holds the liquid's carbon beyond the free gas. CaCO3 + CO2 + H2O -> Ca(HCO3)2, dH -40.3 kJ/mol (Ca2+(aq) -542.8 and
# HCO3-(aq) -692.0 kJ/mol: hf = -542.8 - 2 x 692.0 = -1926.8; the others -1207, -393.5, -286). It melts at 271 K, the
# freezing point of a salty liquid, so it is liquid where the liquid is; it never boils (3000 K), so evaporation leaves it
# behind. Heat capacity as its parts (Kopp's rule: 82 + 37 + 75 = 194), so dH does not change with temperature. Its liquid
# density is set to the volume it adds to the liquid, about 30 cm3/mol (the partial molar volume of the dissolved ions, rough).
