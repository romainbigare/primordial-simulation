# Chemistry 0. Numbers only. element_masses g/mol (a substance's molar mass is the sum over its elements e),
# cp J/(mol K), melt/boil K, rho kg/m3 [solid, liquid], dense K (where the pure liquid is densest; none: at its melting point),
# dense_drop K per g/kg (how far what is dissolved lowers that; none: 0), hard/str 0..1,
# refl [[solid rgb], [liquid rgb]], heat [[m2/mol, mol/m2]; 3] in each band of heat radiation (heat_bands, then all the
# other wavelengths): its absorption and the column past which its optical depth grows as the square root of the amount
# (0: always in proportion; none: 0), cont m2/(mol Pa) (its continuum, by its column times its own pressure; none: 0),
# sw m2/mol and swsat mol/m2 (the same for sunlight; none: 0),
# ray m2/mol (the sunlight its molecules scatter; none: 0), sol mole fraction (for a gas that cannot condense on the ground: dissolved under
# 101 kPa of it at 298 K; no law reads it for a solid, which dissolves only by melting below the liquid's melting point,
# as 11 and 12 do), cond W/(m K), hf kJ/mol of the solid (of a substance that is liquid at 290 K: its measured value less lf; gas:
# less lf and lv), lv/lf kJ/mol (none: Trouton's and Richards's rules), rupture MPa. Where a number is derived, the derivation is in docs/numbers.md.
element_masses = [1, 12, 14, 16, 28, 40, 56, 64, 23, 35.5, 27]
# The bands of heat radiation, µm, but the last, which is all the other wavelengths.
heat_bands = [[8.0, 12.5], [12.5, 18.0]]

