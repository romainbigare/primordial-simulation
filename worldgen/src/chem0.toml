# 21: burning body matter, C6H10O5 + 6 O2 -> 6 CO2 + 5 H2O (as 1, for 22). Open world: first order in the matter, the
# oxygen to its 6th power (mass action), 0.21^6 = 8.6e-5, so for 0.2 of it a year at 290 K (rate 6.5e-9 /s, 18.6% lost
# in a year) k exp(-ea/290) = 6.5e-9 / 8.6e-5 = 7.6e-5 /s; ea 9000 K (7760 for 1: structure resists), k = 7.6e-5 x
# exp(9000/290) = 2.28e9. The litter constant of 1 (0.27 a year), a little lower for the tissue that resists. It was
# 5% a year (k 5.7e8): the figure for standing dead stems, not for the litter of plants that live a month.
[[r]] # 21
i = [[22,1],[2,6]]
o = [[3,6],[0,5]]
k = 2.28e9
ea = 9000

# 22 and 23: the liquid's store of carbon, CaCO3 + CO2 + H2O <-> Ca(HCO3)2 both ways. Plain mass action. The way back is
# written for three of the salt (3 Ca(HCO3)2 -> 3 CaCO3 + 3 CO2 + 3 H2O) because the real way back takes one Ca2+ and two
# HCO3-, three particles whose shares in the liquid multiply: its rate per unit of the salt goes with the salt's share of
# the liquid to the power 3 - 1 = 2. So the liquid holds salt in proportion to its own amount (to the power 2/3; a dry cell
# holds none) and to the cube root of the gas over it (the real law, [Ca2+][HCO3-]^2 = K pCO2, gives the cube root too).
# - Ea: 22 is gas transfer, 1.4 times faster per 10 K -> 2,800 K. 23 is 2,800 + dH/R = 2,800 + 40.3e3/8.314 = 7,647 K, so
#   the balance moves with warmth as dH says (the liquid holds less when warm).
# - k of 22: a deep liquid takes the air's gas at the Earth's gross exchange between air and its liquid cover, 80 of 589 PgC a year
#   (Ciais et al. 2013) over the 71% of the planet that the liquid covers: 0.19 a year per unit of the gas over it at 288 K
#   (6.0e-9 /s): k exp(-2800 / 288) = 6.0e-9, k = 1.0e-4.
# - k of 23: set so the balance at 288 K, 400 ppm of the gas and a liquid 500 m deep (the depth of this map's low ground:
#   median 660 m, mean 540 m) is 1.0 mol of salt per m3 of liquid (2.0 mol/m3 of dissolved carbon, the measured amount in
#   the liquid cover of the Earth; pure calcite and gas give 0.6). The balance is S^3 = (k22 / k23) exp(4847 / T) x (the gas over the cell) x
#   (the liquid)^2, so k23 exp(-7647 / 288) = k22 exp(-2800 / 288) x 144 x (2.78e7)^2 / 500^3 = 5.36 /s, k = 1.8e12.
#   Worldgen finds the balance of each cell from these two (`pcore::change::Reactor::balance`).
[[r]] # 22
i = [[10,1],[3,1],[0,1]]
o = [[23,1]]
k = 1.0e-4
ea = 2800

[[r]] # 23
i = [[23,3]]
o = [[10,3],[3,3],[0,3]]
k = 1.8e12
ea = 7647

# Growth, which is not a reaction of the open world: what bodies make of the energy-rich solid, paid by work (Copy): [inputs], [outputs]; the first output is the matter that builds bodies.
[build]
i = [[5,6]]
o = [[22,1],[0,1]]

