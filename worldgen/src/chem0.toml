# 22: body matter, what bodies are built of: 118 of 5 (CH2O), 3 of 24 (the nitrogen mineral) and one of 23 (the rock salt) less 27 of 0,
# C120H196N6O106Ca, so that 118 of 5 + 3 of 24 + 1 of 23 -> 1 of 22 + 27 of 0 is thermoneutral (hf = 118 x -212 + 3 x -365 + -1926.8 -
# 27 x -286 = -20315.8: it holds the energy of what it was made of; burning it gives 55,100 kJ/mol = 15.9 MJ/kg, against 15.6 for 5).
# The salt brings its two carbons into the matter, so growth gives off nothing but the liquid. Carbon to nitrogen 20 (see 24), nitrogen
# 2.4% of the mass, as before. The rock element is 40 of the 3,456 g: 1.16% of the dry mass, as the dry matter of land plants, 0.5 to
# 2% (Marschner, Mineral Nutrition of Higher Plants: 0.5% is enough for most; leaves of plants with broad leaves hold 1 to 2%; from
# memory, unchecked). One matter for all bodies, so the plant's figure (an animal holds more, in bone). The unit of matter is three
# times the unit it was (C40, N2), the smallest whole formula under 2% with one atom of the rock element (two times gives 1.7%, one 3.5%).
# H/C 1.63 and O/C 0.88, as cellulose's 1.67 and 0.83. A high melting point: it chars before it melts. Reflectance as 5's.
