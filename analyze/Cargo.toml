[package]
name = "analyze"
edition.workspace = true
version.workspace = true

[[bin]]
name = "ew-analyze"
path = "src/main.rs"

[dependencies]
pcore = { path = "../core" }
worldgen = { path = "../worldgen" }
tape = { path = "../tape" }
serde_json = "1"

[dev-dependencies]
worldgen = { path = "../worldgen", features = ["testkit"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
