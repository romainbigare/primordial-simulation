[package]
name = "pcore"
edition.workspace = true
version.workspace = true

[dependencies]
serde.workspace = true
rayon = { version = "1", optional = true }

[features]
# Work that is independent per cell, line or domain runs on threads, with the same results (`par`); the tape's
# walks use the same pool. Not for wasm.
threads = ["dep:rayon"]

[dev-dependencies]
worldgen = { path = "../worldgen", features = ["testkit"] }
serde_json = "1"
rayon = "1"
