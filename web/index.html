<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emergent World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f6f9f'/%3E%3Cpath d='M7 20c4-9 9-3 12-9 3 3 5 6 6 9z' fill='%239cc16c'/%3E%3C/svg%3E">
<!--CSS-->
</head>
<body>
<div class="map" id="map">
  <canvas id="cv"></canvas>
  <div class="msg" id="msg">Loading world…</div>
</div>
<div id="ui">
  <!-- One bar at the top on a wide screen; on a phone a dock at the bottom (each tool named under its icon), with the
       date and the World button at the top (style.css). -->
  <header class="bar" id="bar">
    <div class="grp">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#2f6f9f"/><path d="M7 20c4-9 9-3 12-9 3 3 5 6 6 9z" fill="#9cc16c"/></svg>
      <h1>Emergent World</h1>
      <button class="ib world" data-panel="world" data-icon="globe" aria-label="World" title="World: this world, a new one, open a file"></button>
    </div>
    <div class="grp">
      <button class="ib play" id="play" aria-label="Play" title="Play or pause (space)"></button>
      <label class="speed"><select id="speeds" aria-label="Speed" title="Speed"></select><span class="lb">Speed</span></label>
      <span class="date" id="year"></span>
    </div>
    <div class="grp">
      <button class="ib tool" data-panel="map" data-icon="layers" aria-label="Layers" title="Layers: a layer over the map, and the legend"><span class="lb">Layers</span></button>
      <button class="ib tool" id="inspect-btn" data-icon="inspect" aria-label="Inspect" aria-pressed="false" title="Inspect: what lies under the cursor"><span class="lb">Inspect</span></button>
      <button class="ib tool live-only" id="god-btn" data-icon="wand" aria-label="God mode" aria-pressed="false" title="God mode: change the world"><span class="lb">Create</span></button>
    </div>
  </header>

  <section class="panel glass" id="panel-world" aria-label="World">
    <div class="head"><h2>World</h2><button class="ib sm" data-close data-icon="close" aria-label="Close" title="Close (Esc)"></button></div>
    <div class="meta" id="meta"></div>
    <div class="stats live-only" id="stats" hidden></div>
    <div class="stats cost" id="cost" hidden></div>
    <div class="tape-only">
      <h3>Charts</h3>
      <input id="chartfind" class="find" type="search" placeholder="Search charts (name or section)" aria-label="Search charts" autocomplete="off">
      <div class="charts" id="charts"></div>
    </div>
    <form class="live live-only" id="live">
      <h3>New world</h3>
      <label>Seed <input id="seed" type="number" min="0" step="1" value="1"></label>
      <label>Size <input id="size" type="number" step="1"></label>
      <label>Variety <input id="variety" type="number" step="1"></label>
      <label>Climate <select id="band"></select></label>
      <label>Shape <select id="shape"></select></label>
      <label>Weather <select id="weather"></select></label>
      <button class="primary" type="submit">New world</button>
    </form>
    <h3>Open</h3>
    <div class="row">
      <label class="pill live-only" title="A snapshot of ew run (snap_….bin.gz)">Open a saved world<input id="saved" type="file" accept=".gz,application/gzip" hidden></label>
      <label class="pill" title="A tape of ew run (.ewf.gz)">Open file<input id="file" type="file" accept=".gz,.ewf,application/gzip" hidden></label>
      <button class="pill live-only" id="save" type="button" title="Save the world as it is now, to open it again here or go on with ew resume">Save the world</button>
    </div>
    <div class="live">
      <h3>Test</h3>
      <label class="wide" title="The pixels the picture twice as wide as the view is drawn at, shown at a pan's edge: fewer is faster and softer">Near ring pixels <select id="ringscale"></select></label>
    </div>
  </section>

  <section class="panel glass" id="panel-map" aria-label="Layers">
    <div class="head"><h2>Layers</h2><button class="ib sm" data-close data-icon="close" aria-label="Close" title="Close (Esc)"></button></div>
    <div class="ramp" id="ramp" hidden><div class="shown"><span>Showing <b id="rampname"></b></span><button id="clearlayer">Clear</button></div><div class="grad" id="rampbar"></div><div class="lbl"><span></span><span></span><span></span></div><div class="unit" id="rampunit"></div></div>
    <div class="tri" id="texture" hidden></div>
    <input id="layerfind" class="find layerfind" type="search" placeholder="Search layers" aria-label="Search layers" autocomplete="off">
    <div id="layers"></div>
    <h3>Legend</h3>
    <ul class="classes" id="classes"></ul>
  </section>

  <aside class="card glass" id="inspect-card" aria-label="Inspect" hidden>
    <div id="inspect" class="inspect"><p class="hint">Hover or tap the map.</p></div>
  </aside>

  <!-- God mode (god-menu.ts): the panel of the home, a class's tools or the tool on, and on a phone the big button held
       for a stroke, half over the panel's foot. -->
  <div class="god" id="god" hidden>
    <section class="godpanel glass" id="god-panel" aria-label="God tools"></section>
    <div class="godhold" id="god-hold"></div>
  </div>
  <div class="busy glass" id="busy" role="status" hidden><i></i>Updating ground…</div>

  <div class="tl glass tape-only" id="timebar">
    <div class="track">
      <div class="marks" id="marks"></div>
      <input id="tl" type="range" min="0" max="0" value="0" aria-label="Timeline">
    </div>
    <div class="ends"><span id="y0"></span><span id="y1"></span></div>
  </div>
  <button class="ib fit glass" id="fit" data-icon="fit" aria-label="Fit map" title="Fit map (F, or double-click)"></button>
  <div class="errors glass" id="errors" hidden></div>
</div>
<!-- The loading screen (boot.ts): over everything till the map first stands whole. -->
<div id="boot" role="progressbar" aria-label="Loading the world">
  <canvas></canvas>
  <div class="name">EMERGENT WORLD</div>
  <div class="text"><div class="pct">0%</div><div><span class="now">Loading</span><span class="note"></span></div><div class="dots"></div></div>
</div>
<div id="tip" class="tip" hidden></div>
<div id="drop" class="dropzone" hidden>Drop a .ewf.gz file</div>
<!--JS-->
</body>
</html>
